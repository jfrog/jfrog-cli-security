name: "Static Analysis"
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Go-Lint:
    name: Lint ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu, windows, macos ]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main
        with:
          go-version-file: go.mod

      - name: Run Go vet
        run: go vet -v ./...

  Go-Fmt:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main
        with:
          go-version-file: go.mod

      - name: Verify go fmt is clean
        run: |
          changed=$(go fmt ./...)
          if [ -n "$changed" ]; then
            echo "::error::go fmt ./... changed files. Run 'go fmt ./...' and commit the result before merging."
            echo "$changed"
            git --no-pager diff
            exit 1
          fi

  Static-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main
        with:
          go-version-file: go.mod

      - name: Run Go vet
        run: go vet -v ./...

      - name: Run golangci linter
        uses: jfrog/.github/actions/golangci-lint@main

      - name: Check AI help coverage
        uses: jfrog/.github/actions/ai-help-coverage@main

  Go-Sec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main
        with:
          go-version-file: go.mod

      - name: Run Go-Sec scanner
        uses: jfrog/.github/actions/gosec-scanner@main

  Check-Spelling:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Check spelling
        uses: crate-ci/typos@master
